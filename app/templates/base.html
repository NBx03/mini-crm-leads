<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-CRM</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 960px; padding: 16px; color: #222; }
    h1 { font-size: 22px; }
    form.add { display: grid; gap: 8px; margin-bottom: 24px; max-width: 480px; }
    input, textarea, button { font: inherit; padding: 6px 8px; }
    button { cursor: pointer; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
    .error { color: #b00020; }
    .muted { color: #777; }
    .filter { margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .filter a, .chip { background: #eef; border-radius: 10px; padding: 2px 8px; font-size: 14px; text-decoration: none; color: #223; }
    .filter a.active { background: #446; color: #fff; }
    .chip { display: inline-flex; align-items: center; gap: 2px; margin: 0 4px 4px 0; }
    form.inline { display: inline; margin: 0; }
    .chip button { border: 0; background: none; padding: 0 2px; color: #667; }
    form.tag-add input { width: 110px; padding: 2px 6px; font-size: 14px; }
  </style>
</head>
<body>
  <h1><a href="/" style="color:inherit;text-decoration:none">Мини-CRM</a></h1>
  {% block content %}{% endblock %}
</body>
</html>
